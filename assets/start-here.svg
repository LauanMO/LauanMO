<svg width="1100" height="340" viewBox="0 0 1100 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Start here</title>
  <desc id="desc">Three routes into Lauan Moreira's profile: portfolio, projects and contact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0620"/>
      <stop offset="0.55" stop-color="#100a2b"/>
      <stop offset="1" stop-color="#140d33"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8dff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#5b8dff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="0.8" stop-color="#34d399"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-140 0;140 0;-140 0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="route" x1="120" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8dff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.28" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2862fb" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#7c4dff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0a0620" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ea8ff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .eyebrow{font:800 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:4px;fill:#8ea8ff}
      .title{font:900 52px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f2f0ff}
      .sub{font:500 19px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#a49dc9}
      .term{font:700 15px 'Cascadia Mono','SF Mono',Consolas,'Liberation Mono',monospace;fill:#86efac}
      .meta{font:800 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2.5px}
      .btn{font:800 25px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f2f0ff}
      .small{font:500 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#a49dc9}
    </style>
  </defs>

  <rect width="1100" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1100" height="340" rx="28" fill="url(#grid)"/>
  <rect width="1100" height="340" rx="28" fill="url(#ambient)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="14" width="1072" height="312" rx="22" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="420 150" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-570" dur="24s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(70 78)">
    <text x="0" y="0" class="eyebrow">START HERE</text>
    <text x="0" y="58" class="title">PICK A ROUTE</text>
    <text x="0" y="96" class="sub">Everything worth opening, one click away.</text>
  </g>

  <g transform="translate(752 52)">
    <rect width="292" height="92" rx="16" fill="#0a0620" fill-opacity="0.72" stroke="#2e2463" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="4" fill="#f87171" opacity="0.8"/>
    <circle cx="36" cy="20" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="50" cy="20" r="4" fill="#34d399" opacity="0.8"/>
    <text x="22" y="52" class="term">&gt; lauan@fortaleza: online</text>
    <text x="22" y="76" class="term">&gt; open to opportunities</text>
    <rect x="234" y="63" width="9" height="16" fill="#86efac">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M120 248H980" stroke="url(#route)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 24" opacity="0.7" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-128" dur="18s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(70 200)">
    <rect width="292" height="96" rx="18" fill="#0b0724" fill-opacity="0.9" stroke="#5b8dff" stroke-width="1.6"/>
    <circle cx="36" cy="48" r="13" fill="#5b8dff" filter="url(#glow)">
      <animate attributeName="r" values="12;14;12" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="32" class="meta" fill="#8ea8ff">PERSONAL SITE</text>
    <text x="66" y="62" class="btn">Portfolio</text>
    <text x="66" y="84" class="small">lauanmoreira.vercel.app</text>
  </g>

  <g transform="translate(404 200)">
    <rect width="292" height="96" rx="18" fill="#0b0724" fill-opacity="0.9" stroke="#7c4dff" stroke-width="1.6"/>
    <circle cx="36" cy="48" r="13" fill="#7c4dff" filter="url(#glow)">
      <animate attributeName="r" values="12;14;12" dur="9s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="32" class="meta" fill="#b9a5ff">WHAT I'VE BUILT</text>
    <text x="66" y="62" class="btn">Projects</text>
    <text x="66" y="84" class="small">web · mobile · APIs · AI</text>
  </g>

  <g transform="translate(738 200)">
    <rect width="292" height="96" rx="18" fill="#0b0724" fill-opacity="0.9" stroke="#34d399" stroke-width="1.6"/>
    <circle cx="36" cy="48" r="13" fill="#34d399" filter="url(#glow)">
      <animate attributeName="r" values="12;14;12" dur="10s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="32" class="meta" fill="#6ee7b7">GET IN TOUCH</text>
    <text x="66" y="62" class="btn">Contact</text>
    <text x="66" y="84" class="small">moreiralauanpro@gmail.com</text>
  </g>
</svg>
