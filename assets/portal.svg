<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Personal portfolio</title>
  <desc id="desc">Main portal to Lauan Moreira's portfolio website, with links to work, stack and contact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0620"/>
      <stop offset="0.5" stop-color="#110a2e"/>
      <stop offset="1" stop-color="#0a0620"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2862fb" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#7c4dff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0a0620" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8dff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5b8dff"/>
      <stop offset="0.7" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2862fb"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8dff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8ea8ff"/>
      <stop offset="1" stop-color="#5b8dff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8ea8ff" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .eyebrow{font:800 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:6px;fill:#6ee7b7}
      .title{font:900 78px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2px;fill:#f2f0ff}
      .sub{font:500 22px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#a49dc9}
      .pill{font:800 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2.5px;fill:#e4e0ff}
      .pillMain{font:800 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2.5px;fill:#ffffff}
    </style>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="30" fill="url(#core)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="12" y="12" width="1176" height="336" rx="24" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="460 160" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-620" dur="26s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#5b8dff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M40 78V40H78"/>
    <path d="M1122 40H1160V78"/>
    <path d="M40 282V320H78"/>
    <path d="M1160 282V320H1122"/>
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="6s" repeatCount="indefinite"/>
  </g>
  <rect x="420" y="40" width="360" height="3" rx="1.5" fill="url(#bar)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="98" text-anchor="middle" class="eyebrow">PERSONAL PORTFOLIO</text>
  <text x="600" y="180" text-anchor="middle" class="title">LAUAN MOREIRA</text>
  <text x="600" y="222" text-anchor="middle" class="sub">Full stack developer · Fortaleza, Brazil</text>

  <g transform="translate(305 254)">
    <rect width="118" height="42" rx="21" fill="#0b0724" stroke="#3a2f78" stroke-width="1.5"/>
    <text x="59" y="26.5" text-anchor="middle" class="pill">WORK</text>
  </g>
  <g transform="translate(441 254)">
    <rect width="118" height="42" rx="21" fill="#0b0724" stroke="#3a2f78" stroke-width="1.5"/>
    <text x="59" y="26.5" text-anchor="middle" class="pill">STACK</text>
  </g>
  <g transform="translate(577 254)">
    <rect width="136" height="42" rx="21" fill="#0b0724" stroke="#3a2f78" stroke-width="1.5"/>
    <text x="68" y="26.5" text-anchor="middle" class="pill">CONTACT</text>
  </g>
  <g transform="translate(731 254)">
    <rect width="164" height="42" rx="21" fill="url(#cta)" filter="url(#glow)"/>
    <text x="82" y="26.5" text-anchor="middle" class="pillMain">VISIT SITE →</text>
  </g>

  <g transform="translate(1110 280)" filter="url(#glow)">
    <circle r="30" fill="none" stroke="#2e2463" stroke-width="2"/>
    <circle r="18" fill="none" stroke="#5b8dff" stroke-width="2" opacity="0.6"/>
    <path d="M0 0L0 -30A30 30 0 0 1 26 -15Z" fill="#5b8dff" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#8ea8ff">
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
