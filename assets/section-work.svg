<svg width="1100" height="130" viewBox="0 0 1100 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Featured work</title>
  <desc id="desc">Section title for the featured projects: web, mobile, APIs and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0620"/>
      <stop offset="0.5" stop-color="#120b30"/>
      <stop offset="1" stop-color="#0a0620"/>
    </linearGradient>
    <linearGradient id="lineL" x1="60" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8dff" stop-opacity="0"/>
      <stop offset="1" stop-color="#5b8dff"/>
    </linearGradient>
    <linearGradient id="lineR" x1="690" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title{font:800 34px 'Cascadia Mono','SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:9px;fill:#f2f0ff}
      .sub{font:600 15px 'Cascadia Mono','SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:3px;fill:#7a73a8}
    </style>
  </defs>
  <rect width="1100" height="130" rx="22" fill="url(#bg)"/>
  <text x="550" y="62" text-anchor="middle" class="title">FEATURED WORK</text>
  <path d="M60 84H410" stroke="url(#lineL)" stroke-width="2"/>
  <path d="M690 84H1040" stroke="url(#lineR)" stroke-width="2"/>
  <path d="M60 84H410" stroke="#f2f0ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="60 600" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="660;0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M690 84H1040" stroke="#f2f0ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="60 600" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;660" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="550" y="108" text-anchor="middle" class="sub">web • mobile • apis • ai</text>
</svg>
