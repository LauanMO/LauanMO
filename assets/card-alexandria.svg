<svg width="540" height="270" viewBox="0 0 540 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alexandria</title>
  <desc id="desc">Alexandria: personal library mobile app to search books, track reading, rate and comment. React Native and Express.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="540" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0620"/>
      <stop offset="1" stop-color="#130b33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0620" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#b9a5ff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .eyebrow{font:800 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2.5px;fill:#b9a5ff}
      .title{font:900 36px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f2f0ff}
      .desc{font:500 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#a49dc9}
      .tag{font:800 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:1.5px;fill:#b9a5ff}
    </style>
  </defs>

  <rect width="540" height="270" rx="24" fill="url(#bg)"/>
  <rect width="540" height="270" rx="24" fill="url(#grid)"/>
  <rect width="540" height="270" rx="24" fill="url(#halo)"/>
  <rect x="8" y="8" width="524" height="254" rx="19" fill="none" stroke="#7c4dff" stroke-width="1.6" stroke-dasharray="220 90" stroke-linecap="round" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-310" dur="15s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(116 138)">
    <g filter="url(#glow)">
      <path d="M0 -38C-22 -52 -52 -52 -76 -42V42C-52 32 -22 32 0 46Z" fill="#100a2e" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M0 -38C22 -52 52 -52 76 -42V42C52 32 22 32 0 46Z" fill="#100a2e" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M0 -38V46" stroke="#a78bfa" stroke-width="2"/>
    </g>
    <g stroke="#6f5bb8" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M-62 -24C-46 -30 -26 -30 -12 -22"/>
      <path d="M-62 -8C-46 -14 -26 -14 -12 -6"/>
      <path d="M-62 8C-46 2 -26 2 -12 10"/>
      <path d="M12 -22C26 -30 46 -30 62 -24"/>
      <path d="M12 -6C26 -14 46 -14 62 -8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 -8;0 0" dur="7s" repeatCount="indefinite"/>
      <circle cx="44" cy="30" r="18" fill="#0a0620" fill-opacity="0.75" stroke="#6ee7b7" stroke-width="2.8" filter="url(#glow)"/>
      <path d="M57 43L72 58" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round"/>
      <path d="M36 24A10 10 0 0 1 46 18" stroke="#d1fae5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>
  </g>

  <text x="232" y="76" class="eyebrow">CAPSTONE · MOBILE APP</text>
  <text x="232" y="118" class="title">ALEXANDRIA</text>
  <text x="232" y="154" class="desc">Search books, track reading,</text>
  <text x="232" y="178" class="desc">rate and comment on titles.</text>

  <g transform="translate(232 202)">
    <rect width="132" height="28" rx="14" fill="#7c4dff" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="66" y="18.5" text-anchor="middle" class="tag">REACT NATIVE</text>
    <rect x="142" width="86" height="28" rx="14" fill="#7c4dff" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="185" y="18.5" text-anchor="middle" class="tag">EXPRESS</text>
  </g>
</svg>
