<svg width="540" height="270" viewBox="0 0 540 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MandaRim</title>
  <desc id="desc">MandaRim: Mandarin learning platform with flashcards, spaced repetition and AI exercises. React and FastAPI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="540" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0620"/>
      <stop offset="1" stop-color="#120b31"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2862fb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0620" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8ea8ff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .eyebrow{font:800 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2.5px;fill:#8ea8ff}
      .title{font:900 36px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f2f0ff}
      .desc{font:500 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#a49dc9}
      .tag{font:800 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:1.5px;fill:#8ea8ff}
      .hanzi{font:700 56px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif;fill:#f2f0ff}
      .pinyin{font:600 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:1px;fill:#8ea8ff}
    </style>
  </defs>

  <rect width="540" height="270" rx="24" fill="url(#bg)"/>
  <rect width="540" height="270" rx="24" fill="url(#grid)"/>
  <rect width="540" height="270" rx="24" fill="url(#halo)"/>
  <rect x="8" y="8" width="524" height="254" rx="19" fill="none" stroke="#5b8dff" stroke-width="1.6" stroke-dasharray="220 90" stroke-linecap="round" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="0" to="-310" dur="14s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(118 140)">
    <rect x="-46" y="-60" width="92" height="120" rx="14" fill="#140d33" stroke="#7c4dff" stroke-width="2" opacity="0.75" transform="rotate(-13) translate(-16 6)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6s" repeatCount="indefinite"/>
      <g transform="rotate(5)">
        <rect x="-46" y="-60" width="92" height="120" rx="14" fill="#0f0a2c" stroke="#5b8dff" stroke-width="2.2" filter="url(#glow)"/>
        <text x="0" y="12" text-anchor="middle" class="hanzi">中</text>
        <text x="0" y="42" text-anchor="middle" class="pinyin">zhōng</text>
      </g>
    </g>
    <path d="M58 -66l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#6ee7b7" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M70 -34l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#8ea8ff">
      <animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="232" y="76" class="eyebrow">AI LEARNING PLATFORM</text>
  <text x="232" y="118" class="title">MANDARIM</text>
  <text x="232" y="154" class="desc">Flashcards, spaced repetition</text>
  <text x="232" y="178" class="desc">and AI exercises with Gemini.</text>

  <g transform="translate(232 202)">
    <rect width="68" height="28" rx="14" fill="#5b8dff" fill-opacity="0.1" stroke="#5b8dff" stroke-opacity="0.55"/>
    <text x="34" y="18.5" text-anchor="middle" class="tag">REACT</text>
    <rect x="78" width="86" height="28" rx="14" fill="#5b8dff" fill-opacity="0.1" stroke="#5b8dff" stroke-opacity="0.55"/>
    <text x="121" y="18.5" text-anchor="middle" class="tag">FASTAPI</text>
  </g>
</svg>
