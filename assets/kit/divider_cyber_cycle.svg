  <defs>
    <linearGradient id="divider-cyber-a" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2862fb"/>
      <stop offset="50%" stop-color="#7c4dff"/>
